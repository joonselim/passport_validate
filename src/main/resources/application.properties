spring.application.name=passport-validate
server.port=8080

# JSON bodies carry Base64 of DG1 (~100 B), SOD (~3 KB), DG2 (~30 KB)
spring.servlet.multipart.max-request-size=2MB
spring.codec.max-in-memory-size=2MB

# Directory holding CSCA certificates / ICAO master lists (relative to working dir)
passport.csca.dir=csca

# Server's HPKE private key (created on first run, never commit it)
passport.hpke.key-file=keys/hpke-x25519.key

# Digital ID issuer key and certificate (created on first run, never commit them)
passport.issuer.key-file=keys/issuer-p256.key
passport.issuer.cert-file=keys/issuer.cer

# Never log request bodies: MRZ is personal data
logging.level.dev.joonselim.passport=INFO
